name: pigmy_app
description: Pigmy Collection Application with offline-first support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  device_info_plus: ^11.3.0
  android_id: ^0.4.1
  media_drm_id: ^0.0.2
  shared_preferences: ^2.5.3

  # Animations
  flutter_animate: ^4.5.2

  # Utilities
  equatable: ^2.0.7
  intl: ^0.20.1
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
